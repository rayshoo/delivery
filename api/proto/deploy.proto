syntax = "proto3";

package deploy;
option go_package = "delivery/api/gen/proto";

import "google/api/annotations.proto";
import "google/protobuf/struct.proto";

service Deploy {
  rpc Deploy(DeployRequest) returns (stream DeployResponse) {
    option (google.api.http) = {
      post: "/api/v1/deploy"
      body: "*"
    };
  }
}

message DeployRequest {
  CommitSpec commitSpec = 1;
  repeated DeploySpec deploySpecs = 2;
}

message CommitSpec {
  string CommitMessage = 1;
  optional string CommitUserName = 2;
  optional string CommitUserEmail = 3;
}

message DeploySpec {
  string url = 1;
  repeated Update updates = 2;
}

message Update {
  optional string branch = 1;
  repeated Path paths = 2;
}

message Path {
  string path = 1;
  optional Kustomize kustomize = 2;
  repeated Yq yq = 3;
}

message Kustomize {
  repeated Image images = 1;
}

message Image {
  string name = 1;
  optional string newName = 2;
  optional string newTag = 3;
}

message Yq {
  string file = 1;
  string key = 2;

  // value 는 타입을 보존해서 값을 받는다.
  //
  // google.protobuf.Value 는 null / 숫자 / 문자열 / bool / 구조를 모두 담는
  // union 타입이다. 예전에는 string 이라 서버가 "문자열 2" 와 "숫자 2" 를
  // 구분할 수 없어, 값을 yq expression 에 그대로 이어 붙여 yq 가 타입을
  // 정하게 했다. 그래서 값에 따옴표를 박아 넣는 우회가 필요했고, 여러 줄
  // YAML 을 넣으면 렉서가 깨졌다.
  google.protobuf.Value value = 3;
}

message DeployResponse {
  optional string message = 1;
}
